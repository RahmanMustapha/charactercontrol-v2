[project]
name = "charactercontrol-v2"
version = "0.1.0"
description = "Body-as-controller system using Xsens motion capture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charactercontrol"]
